<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Secure Gallery">
    
    <!-- Manifest (1 File me App Install ke liye) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Secure Gallery","short_name":"Gallery","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3135/3135715.png","sizes":"512x512","type":"image/png"}]}'>

    <title>Secure App</title>
    <style>
        /* ==========================================
           HARDCORE APP CSS (No Selection / No Drag)
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important; 
            -khtml-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Mobile App feel */
            touch-action: none; 
        }

        /* ==========================================
           SCREEN 1: HOME (App Grid Style)
           ========================================== */
        #home-screen {
            width: 100%;
            height: 100%;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-content: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .home-card {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23222"/></svg>');
        }

        .home-card:active {
            transform: scale(0.95);
        }

        .home-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(12px);
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .home-card::after {
            content: '🔒 Locked';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 8px 16px; border-radius: 30px;
            font-size: 13px; font-weight: 600; white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* ==========================================
           SCREEN 2: FULLSCREEN SECURE VIEWER
           ========================================== */
        #viewer-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            opacity: 0;
        }

        #viewer-screen.active {
            display: flex;
            animation: appOpenAnimation 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes appOpenAnimation {
            0% { opacity: 0; transform: scale(0.8); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0px); }
        }

        /* App Header Bar */
        .app-header {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            z-index: 200;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .close-btn {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.2);
            border: none; border-radius: 50%; color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }

        .close-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Image Container */
        .image-container {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .image-wrapper {
            position: relative;
            width: 100%; max-width: 500px;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            background: #111;
            isolation: isolate; 
        }

        .actual-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            pointer-events: none !important; 
            -webkit-user-drag: none;
        }

        #scratch-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            cursor: crosshair;
            transition: opacity 0.5s ease;
            touch-action: none;
        }

        .scratch-hint {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 10px 20px; border-radius: 30px;
            font-size: 14px; font-weight: 600;
            pointer-events: none; z-index: 20;
            animation: pulseHint 1.5s infinite;
        }

        @keyframes pulseHint {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* ==========================================
           SECURITY SCREENS
           ========================================== */
        #security-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; color: #fff; text-align: center; padding: 20px;
        }
        #security-overlay.active { display: flex; }
        #security-overlay svg { width: 60px; height: 60px; fill: #ef4444; margin-bottom: 20px; }

        #blur-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9998;
            display: none; align-items: center; justify-content: center;
            color: #ef4444; font-weight: 800; font-size: 18px;
            letter-spacing: 2px; text-transform: uppercase;
        }
        #blur-overlay.active { display: flex; }

    </style>
</head>
<body>

    <!-- SCREEN 1: HOME -->
    <div id="home-screen">
        <div class="home-card" onclick="openViewer('https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=800')">
            <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=800" alt="card1">
        </div>
        <div class="home-card" onclick="openViewer('https://images.unsplash.com/photo-1611162616305-c69b3fa7fbe0?q=80&w=800')">
            <img src="https://images.unsplash.com/photo-1611162616305-c69b3fa7fbe0?q=80&w=800" alt="card2">
        </div>
        <div class="home-card" onclick="openViewer('https://images.unsplash.com/photo-1611162618071-b39a2ec055fb?q=80&w=800')">
            <img src="https://images.unsplash.com/photo-1611162618071-b39a2ec055fb?q=80&w=800" alt="card3">
        </div>
        <div class="home-card" onclick="openViewer('https://images.unsplash.com/photo-1611162616475-46b635cb6868?q=80&w=800')">
            <img src="https://images.unsplash.com/photo-1611162616475-46b635cb6868?q=80&w=800" alt="card4">
        </div>
    </div>

    <!-- SCREEN 2: FULLSCREEN VIEWER -->
    <div id="viewer-screen">
        <div class="app-header">
            <button class="close-btn" onclick="closeViewer()">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <div class="image-container">
            <div class="image-wrapper">
                <img id="full-img" class="actual-image" src="" alt="protected">
                <canvas id="scratch-canvas"></canvas>
                <div class="scratch-hint" id="hint-text">
                    ✨ Scratch to reveal
                </div>
            </div>
        </div>
    </div>

    <!-- SECURITY OVERLAYS -->
    <div id="security-overlay">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.48 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <h2>Security Alert!</h2>
        <p style="margin-top:10px; color:#aaa;">App requires secure environment. Screenshot/Print blocked.</p>
    </div>

    <div id="blur-overlay">
        ⚠️ APP LOCKED
    </div>

<script>
    /* ==========================================
       APP LOGIC (Scratch & Security)
       ========================================== */

    const viewer = document.getElementById('viewer-screen');
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    const fullImg = document.getElementById('full-img');
    const hintText = document.getElementById('hint-text');
    const blurOverlay = document.getElementById('blur-overlay');
    
    let isDrawing = false;
    let isRevealed = false;
    let lastPos = null;

    // Open Viewer
    function openViewer(imgUrl) {
        fullImg.src = imgUrl;
        viewer.style.display = 'flex';
        setTimeout(() => {
            viewer.classList.add('active');
            initCanvas();
        }, 10);
    }

    // Close Viewer
    function closeViewer() {
        viewer.classList.remove('active');
        setTimeout(() => {
            viewer.style.display = 'none';
            fullImg.src = ""; // DOM Clear for security
            isRevealed = false;
            canvas.style.opacity = '1';
            canvas.style.display = 'block';
            hintText.style.display = 'flex';
        }, 300);
    }

    // Canvas Init
    function initCanvas() {
        const wrapper = document.querySelector('.image-wrapper');
        canvas.width = wrapper.offsetWidth;
        canvas.height = wrapper.offsetHeight;

        ctx.globalCompositeOperation = 'source-over';
        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#9ca3af');
        gradient.addColorStop(0.5, '#e5e7eb');
        gradient.addColorStop(1, '#9ca3af');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        for(let i=0; i<canvas.width; i+=4) {
            for(let j=0; j<canvas.height; j+=4) {
                if(Math.random() > 0.5) ctx.fillRect(i, j, 2, 2);
            }
        }

        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 45; // Thicker for touch
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    // Scratch Logic
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startSmoothScratch(e) {
        if (isRevealed) return;
        e.preventDefault();
        isDrawing = true;
        hintText.style.display = 'none';
        lastPos = getPointerPos(e);
        scratchSmooth(e);
    }

    function scratchSmooth(e) {
        if (!isDrawing || isRevealed) return;
        e.preventDefault();
        const currentPos = getPointerPos(e);
        if (lastPos) {
            ctx.beginPath();
            ctx.moveTo(lastPos.x, lastPos.y);
            ctx.lineTo(currentPos.x, currentPos.y);
            ctx.stroke();
        }
        lastPos = currentPos;
        checkRevealProgress();
    }

    function stopScratch() {
        isDrawing = false;
        lastPos = null;
    }

    function checkRevealProgress() {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
        let clearPixels = 0;
        const totalPixels = pixels.length / 4;

        for (let i = 3; i < pixels.length; i += 4 * 10) {
            if (pixels[i] === 0) clearPixels++;
        }
        const clearPercent = (clearPixels / (totalPixels / 10)) * 100;
        if (clearPercent > 40) revealFull();
    }

    function revealFull() {
        isRevealed = true;
        canvas.style.opacity = '0';
        setTimeout(() => { canvas.style.display = 'none'; }, 500);
    }

    canvas.addEventListener('mousedown', startSmoothScratch);
    canvas.addEventListener('mousemove', scratchSmooth);
    window.addEventListener('mouseup', stopScratch);
    canvas.addEventListener('touchstart', startSmoothScratch, { passive: false });
    canvas.addEventListener('touchmove', scratchSmooth, { passive: false });
    window.addEventListener('touchend', stopScratch);


    /* ==========================================
       HARDCORE APP SECURITY (PWA LEVEL)
       ========================================== */

    // Block Context Menu
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Block Drag
    document.addEventListener('dragstart', e => e.preventDefault());

    // Block Keyboard Shortcuts
    document.addEventListener('keydown', function(e) {
        if (
            (e.ctrlKey && ['s','S','p','P','u','U'].includes(e.key)) ||
            (e.ctrlKey && e.shiftKey && ['i','I','s','S','j','J','c','C'].includes(e.key)) ||
            e.key === 'F12'
        ) {
            e.preventDefault();
            showSecurityWarning();
            return false;
        }

        // Print Screen Alert
        if (e.key === 'PrintScreen' || e.keyCode === 44) {
            e.preventDefault();
            showSecurityWarning();
            if (navigator.clipboard) {
                navigator.clipboard.writeText('Screenshot Blocked by Secure App!');
            }
            return false;
        }
    });

    // Focus Blur (Anti-Screen Recording & Snipping)
    window.addEventListener('blur', function() {
        if(viewer.classList.contains('active')) blurOverlay.classList.add('active');
    });

    window.addEventListener('focus', function() {
        blurOverlay.classList.remove('active');
    });

    document.addEventListener('visibilitychange', function() {
        if (document.hidden && viewer.classList.contains('active')) {
            blurOverlay.classList.add('active');
        } else {
            blurOverlay.classList.remove('active');
        }
    });

    function showSecurityWarning() {
        const overlay = document.getElementById('security-overlay');
        overlay.classList.add('active');
        setTimeout(() => overlay.classList.remove('active'), 2500);
    }

    // Register Service Worker for PWA (Offline & App Mode)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            // Simple inline service worker for PWA requirement
            const swCode = `self.addEventListener('fetch', function(event) {});`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW err:', err));
        });
    }
</script>
</body>
</html>
